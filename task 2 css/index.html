<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- this is the big main box -->
    <div class="timeline-container">
<!-- it draws the long horizontal line -->
        <div class="timeline-line"></div>
<!-- it holds two things inside it that is DOT And CARD  -->
        <div class="timeline-item">
            <div class="dot dot-green"></div>
<!-- Its a white box cantaining the text , its hold the <h2>(year) and <p>(description)-->
            <div class="card">
                <h2 class="year">1982</h2>
                <p>Started as Medical <br> Representative at Bevit <br> Pharmaceuticals.</p>
            </div>
        </div>

        <div class="timeline-item">
            <div class="dot dot-blue"></div>
            <div class="card">
                <h2 class="year">1987</h2>
                <p>Promoted to Area <br> Manager, expanded <br> Karnataka operations.</p>
            </div>
        </div>

        <div class="timeline-item">
            <div class="dot dot-blue"></div>
            <div class="card">
                <h2 class="year">1994</h2>
                <p>Became Regional <br> Manager, led 25-member <br> team.</p>
            </div>
        </div>

        <div class="timeline-item">
            <div class="dot dot-blue"></div>
            <div class="card">
                <h2 class="year">1998</h2>
                <p>Assigned Maharashtra <br> region for business <br> expansion.</p>
            </div>
        </div>

    </div>

</body>
</html>
