<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="text-content">
            <h1>We'll find you the <br><span class="highlight">best policy.</span></h1>
            <p class="subtext">
                Compare, buy and manage all your insurance policies in one place. 
                Save up to 85% on premiums!
            </p>
            
            <div class="social-proof">
                <div class="avatars">
                    <img src="https://i.pravatar.cc/100?img=1" class="avatar">
                    <img src="https://i.pravatar.cc/100?img=5" class="avatar">
                    <img src="https://i.pravatar.cc/100?img=3" class="avatar">
                    <img src="https://i.pravatar.cc/100?img=9" class="avatar">
                </div>
                <div class="customer-count">
                    <span id="counter">0</span> + <br> 
                    <span>Customers</span>
                </div>
            </div>

            <button class="btn-primary" onclick="handleQuoteClick()">Get Quote</button>
        </div>

        <div class="visual-container">
            <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=400&q=80" class="card-img img-1">
            <img src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=400&q=80" class="card-img img-2">
            <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=400&q=80" class="card-img img-3">
            <img src="https://images.unsplash.com/photo-1489824904134-891ab64532f1?auto=format&fit=crop&w=400&q=80" class="card-img img-4">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
